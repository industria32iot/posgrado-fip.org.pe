# Empaqueta el módulo Dolibarr "Posgrado FIP" (dolibarr/posgradofip) en cada cambio.
#
# Instalación en el portal (sin secrets):
#   1. Abre la ejecución en Actions y descarga el artefacto "module_posgradofip-<versión>".
#      GitHub lo entrega como module_posgradofip-<versión>.zip con la carpeta posgradofip/ en la raíz:
#      es exactamente el paquete que espera Dolibarr. NO lo descomprimas ni le cambies el nombre.
#   2. Dolibarr → Inicio → Configuración → Módulos → "Desplegar/instalar un módulo externo" → sube ese archivo.
#   3. Activa el módulo "Posgrado FIP". Ver docs/CRM-DOLIBARR.md, sección 6.
name: Módulo Dolibarr

on:
  push:
    branches: [main]
    paths:
      - 'dolibarr/**'
      - 'scripts/empaquetar-modulo-dolibarr.sh'
      - '.github/workflows/modulo-dolibarr.yml'
  pull_request:
    paths:
      - 'dolibarr/**'
      - 'scripts/empaquetar-modulo-dolibarr.sh'
      - '.github/workflows/modulo-dolibarr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empaquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar sintaxis PHP
        run: |
          php -v | head -1
          fail=0
          while IFS= read -r -d '' f; do php -l "$f" > /dev/null || fail=1; done < <(find dolibarr -name '*.php' -print0)
          exit $fail

      - name: Empaquetar
        id: paquete
        run: |
          ./scripts/empaquetar-modulo-dolibarr.sh dist-dolibarr
          zip=$(ls dist-dolibarr/module_posgradofip-*.zip)
          echo "nombre=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"
          # GitHub siempre comprime el artefacto en <nombre-del-artefacto>.zip. Se sube el contenido
          # del paquete (carpeta posgradofip/) con el nombre del paquete, para que el .zip descargado
          # sea directamente module_posgradofip-<versión>.zip, válido para Dolibarr.
          mkdir -p artefacto
          unzip -q "$zip" -d artefacto
          test -f artefacto/posgradofip/core/modules/modPosgradoFip.class.php

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paquete.outputs.nombre }}
          path: artefacto/
          retention-days: 30
