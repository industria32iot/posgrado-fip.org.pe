# Compila el sitio para Hostinger en cada cambio de main (o a mano: Actions → "Publicar en Hostinger" → Run workflow).
#
# Publicación SIN secrets (como colibriperu.org.pe):
#   1. Abre la ejecución en Actions y descarga el artefacto "sitio-hostinger" (.zip).
#   2. hPanel → Administrador de archivos → carpeta del subdominio (ej. public_html/nuevo/)
#      → sube el .zip → Extraer. Incluye el archivo oculto .htaccess y api/lead.php.
#
# Publicación automática por FTP (opcional): si existen los secrets FTP_SERVER, FTP_USERNAME,
# FTP_PASSWORD y FTP_SERVER_DIR (Settings → Secrets and variables → Actions), además se sube sola.
# Variable opcional HOSTINGER_NOINDEX = "true" para compilar una copia de prueba que Google no indexe
# (por defecto se compila para producción: https://posgrado-fip.org.pe).
name: Publicar en Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar
        run: npx vite build
        env:
          # El formulario registra a los interesados en Dolibarr a través de este endpoint PHP
          VITE_LEAD_ENDPOINT: /api/lead.php
          NOINDEX: ${{ vars.HOSTINGER_NOINDEX == 'true' }}

      - name: Artefacto para subir a mano
        uses: actions/upload-artifact@v4
        with:
          name: sitio-hostinger
          path: dist/
          include-hidden-files: true # .htaccess (rutas /programa/... y /privacidad)
          retention-days: 30

      - name: Comprobar si hay FTP configurado
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$FTP_SERVER_DIR" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sin FTP configurado: descarga el artefacto 'sitio-hostinger' y súbelo con el administrador de archivos de hPanel."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Subir por FTP (opcional)
        if: steps.ftp.outputs.listo == 'true'
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
