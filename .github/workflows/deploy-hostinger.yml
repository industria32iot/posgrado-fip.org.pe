# Publica el sitio en Hostinger por FTP cada vez que se actualiza main.
#
# Configuración (una sola vez) en GitHub → Settings → Secrets and variables → Actions:
#   Secrets:
#     FTP_SERVER      servidor FTP de Hostinger (hPanel → Archivos → Cuentas FTP), ej. ftp.posgrado-fip.org.pe
#     FTP_USERNAME    usuario FTP
#     FTP_PASSWORD    contraseña FTP
#     FTP_SERVER_DIR  carpeta de destino, terminada en /, ej. /domains/posgrado-fip.org.pe/public_html/nuevo/
#   Variables (opcional):
#     HOSTINGER_NOINDEX  "false" cuando el sitio pase a producción (por defecto la copia NO se indexa)
#
# Mientras falten los secrets, el workflow termina sin publicar nada.
name: Publicar en Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar configuración
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$FTP_SERVER_DIR" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Faltan los secrets FTP_*: no se publica en Hostinger (ver comentarios del workflow)."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.listo == 'true'
        uses: actions/checkout@v4

      - if: steps.cfg.outputs.listo == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.cfg.outputs.listo == 'true'
        run: npm ci

      - if: steps.cfg.outputs.listo == 'true'
        name: Compilar
        run: npx vite build
        env:
          # El formulario registra a los interesados en Dolibarr a través de este endpoint PHP
          VITE_LEAD_ENDPOINT: /api/lead.php
          NOINDEX: ${{ vars.HOSTINGER_NOINDEX != 'false' }}

      - if: steps.cfg.outputs.listo == 'true'
        name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          # Solo sube archivos nuevos o cambiados (y quita del servidor los que se borren de dist/)
          dangerous-clean-slate: false
